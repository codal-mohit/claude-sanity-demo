# Runs Claude Code on every pull request and posts one review comment,
# using the same reviewer subagent and rules as local sessions.
# Requires the ANTHROPIC_API_KEY repository secret.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs never get the API key or a write token.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Task,Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*)"
          prompt: |
            Use the reviewer subagent to review this pull request (base ${{ github.event.pull_request.base.ref }})
            against CLAUDE.md and .claude/rules/.
            Post the findings as one PR comment with `gh pr comment ${{ github.event.pull_request.number }}`,
            most severe first, one line each. If nothing is wrong, say so in one line.
