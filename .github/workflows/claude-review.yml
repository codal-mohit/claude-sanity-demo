# Runs Claude Code headless on every pull request and posts a review
# using the same rules and code-reviewer agent as local sessions.
# Requires the ANTHROPIC_API_KEY repository secret.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  review:
    # Fork PRs never get the API key or a write token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools "Read,Grep,Glob,Task,Bash(git diff:*),Bash(gh pr comment:*)"
          prompt: |
            Use the code-reviewer agent to review this pull request against .claude/rules/.
            Post the findings as one PR comment, most severe first. If nothing is wrong, say so.
